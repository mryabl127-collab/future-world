name: Build Android APK - Future World

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Prerender Android
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FutureWorld.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FutureWorld-v1.0.3.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutureWorld-Android-APK
          path: android/app/build/outputs/apk/debug/FutureWorld.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.3 \
            android/app/build/outputs/apk/debug/FutureWorld.apk \
            android/app/build/outputs/apk/debug/FutureWorld-v1.0.3.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Future World Android v1.0.3 (Iraq Map + Tigris & Euphrates + Round UI + Bilingual + Full Community & Unified Academy)" \
            --notes "• خريطة العراق بوضوح عالي مع مساري نهري دجلة (الأزرق) والفرات (الأحمر) والمدن الرئيسية.\n• زر 'لغات' أحمر أعلى اليمين للتحويل الفوري بين العربية والإنجليزية لجميع الصفحات بدعم RTL/LTR كامل.\n• نظام تسجيل دخول وإنشاء حساب آمن لكل الإيميلات والمنصات.\n• تصميم دائري عصري للأزرار والبطاقات والأيقونات.\n• فحص الروابط والصور المطور مع زر سجل الفحوصات المنبثق.\n• ذكاء اصطناعي شامل يجيب عن كل الأسئلة في كافة المجالات والعلوم وليس الأمن فقط.\n• تنظيف وفحص الجهاز بدائرة تحليل ذكية وفرز دقيق للعناصر غير المفيدة والمفيدة دون حذف عشوائي.\n• دمج مكتبة الكتب الرقمية للأمن السيبراني مع الأكاديمية وإضافة اختبار قياس المستوى.\n• إضافة قسم مجتمع المستقبل الآمن والمحمي للتواصل والحوار وتبادل الأفكار." || \
          gh release upload v1.0.3 \
            android/app/build/outputs/apk/debug/FutureWorld.apk \
            android/app/build/outputs/apk/debug/FutureWorld-v1.0.3.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber
