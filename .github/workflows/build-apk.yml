name: Build Android APK - Future World

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Prerender Android
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FutureWorld.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FutureWorld-v1.0.4.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutureWorld-Android-APK
          path: android/app/build/outputs/apk/debug/FutureWorld.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.4 >/dev/null 2>&1; then
            gh release upload v1.0.4 \
              android/app/build/outputs/apk/debug/FutureWorld.apk \
              android/app/build/outputs/apk/debug/FutureWorld-v1.0.4.apk \
              --clobber
          else
            gh release create v1.0.4 \
              android/app/build/outputs/apk/debug/FutureWorld.apk \
              android/app/build/outputs/apk/debug/FutureWorld-v1.0.4.apk \
              --title "Future World Android v1.0.4 (AI chat fix + Community group chat)" \
              --notes "• إصلاح محادثة الذكاء الاصطناعي: صار يجاوب بشكل ثابت.
              • محادثة جماعية مباشرة في مجتمع المستقبل: الكل يشوف رسائل بعض بنفس اللحظة."
          fi
